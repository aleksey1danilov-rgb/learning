<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль | Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f6fa; color: #1a1a1a; display: flex; min-height: 100vh; }
        
        .sidebar { width: 80px; height: 100vh; background: #fff; border-right: 1px solid #eaedf2; position: fixed; left: 0; top: 0; transition: width 0.3s; overflow: hidden; z-index: 1000; display: flex; flex-direction: column; }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 24px 16px 20px; border-bottom: 1px solid #eaedf2; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon { font-size: 32px; }
        .sidebar-nav { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; color: #5a5e6a; text-decoration: none; transition: all 0.2s; white-space: nowrap; font-size: 14px; font-weight: 500; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; color: #8a8f99; }
        .nav-item span { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; }
        .nav-item:hover { background: #f0f5ff; color: #0066ff; }
        .nav-item.active { background: #e6f0ff; color: #0044cc; }
        .sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid #eaedf2; }
        .nav-item.logout { color: #FF6161; cursor: pointer; }
        
        .main-content { margin-left: 80px; flex: 1; min-height: 100vh; }
        .top-bar { background: #fff; padding: 12px 28px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eaedf2; position: sticky; top: 0; z-index: 100; }
        .top-bar h1 { font-size: 20px; font-weight: 900; margin-right: auto; }
        
        .icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid #eaedf2; background: #fff; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: all 0.3s; color: #5a5e6a; text-decoration: none; padding: 0; flex-shrink: 0; }
        .icon-btn:hover { background: #f0f5ff; border-color: #0066ff; color: #0066ff; }
        
        .content { padding: 24px 32px; max-width: 700px; margin: 0 auto; }
        
        .profile-card { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; padding: 32px 36px; }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: #7B3FAF; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 36px; font-weight: 700; margin: 0 auto 16px; }
        .profile-name { text-align: center; font-size: 22px; font-weight: 700; }
        .profile-role { text-align: center; color: #8a8f99; font-size: 14px; margin-top: 4px; margin-bottom: 24px; }
        
        .info-row { display: flex; padding: 14px 0; border-bottom: 1px solid #f0f2f5; gap: 16px; }
        .info-row:last-child { border-bottom: none; }
        .info-row .label { font-weight: 500; color: #5a5e6a; min-width: 160px; flex-shrink: 0; }
        .info-row .value { color: #1a1a1a; }
        
        .btn { padding: 10px 24px; border-radius: 8px; border: none; font-weight: 500; font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: 'Roboto', sans-serif; }
        .btn-primary { background: #0066ff; color: #fff; }
        .btn-primary:hover { background: #0052cc; }
        .btn-outline { background: transparent; color: #0066ff; border: 1px solid #0066ff; }
        .btn-outline:hover { background: #e6f0ff; }
        .profile-actions { display: flex; gap: 12px; margin-top: 24px; justify-content: center; flex-wrap: wrap; }
        
        .custom-modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99999; justify-content: center; align-items: center; }
        .custom-modal-overlay.show { display: flex; }
        .custom-modal { background: #fff; border-radius: 16px; padding: 24px 28px; max-width: 420px; width: 90%; }
        .custom-modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
        .custom-modal .form-group { margin-bottom: 12px; }
        .custom-modal .form-group label { display: block; font-size: 12px; font-weight: 600; color: #5a5e6a; margin-bottom: 4px; }
        .custom-modal .form-group input { width: 100%; padding: 8px 12px; border: 2px solid #eaedf2; border-radius: 8px; font-size: 14px; font-family: 'Roboto', sans-serif; }
        .custom-modal .form-group input:focus { outline: none; border-color: #0066ff; }
        .custom-modal .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .custom-modal .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 13px; cursor: pointer; font-family: 'Roboto', sans-serif; }
        .custom-modal .btn-cancel { background: #f0f2f5; color: #5a5e6a; }
        .custom-modal .btn-cancel:hover { background: #e0e3e8; }
        
        body.dark { background: #0d0d1a; color: #ffffff; }
        body.dark .sidebar, body.dark .top-bar, body.dark .profile-card, body.dark .custom-modal { background: #1a1a2e !important; border-color: #2d2d44 !important; color: #fff !important; }
        body.dark .nav-item { color: rgba(255,255,255,0.6) !important; }
        body.dark .nav-item:hover { background: rgba(255,255,255,0.06) !important; color: #fff !important; }
        body.dark .nav-item.active { background: rgba(108,62,184,0.2) !important; color: #9B6FE8 !important; }
        body.dark .icon-btn { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.7) !important; }
        body.dark .profile-name { color: #fff !important; }
        body.dark .profile-role { color: rgba(255,255,255,0.4) !important; }
        body.dark .info-row .label { color: rgba(255,255,255,0.5) !important; }
        body.dark .info-row .value { color: rgba(255,255,255,0.8) !important; }
        body.dark .custom-modal h3 { color: #fff !important; }
        body.dark .custom-modal label { color: rgba(255,255,255,0.5) !important; }
        body.dark .custom-modal input { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.8) !important; }
        
        @media (max-width: 768px) {
            .sidebar { width: 0; }
            .main-content { margin-left: 0; }
            .content { padding: 14px; }
            .info-row { flex-direction: column; gap: 4px; }
        }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a href="/pages/admin" class="logo"><span class="logo-icon">🎓</span></a></div>
        <nav class="sidebar-nav">
            <a href="/pages/admin" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
            <a href="/pages/admin/stats" class="nav-item"><i class="fas fa-chart-bar"></i><span>Дашборд</span></a>
            <a href="/pages/admin/employees" class="nav-item"><i class="fas fa-users"></i><span>Сотрудники</span></a>
            <a href="/pages/admin/courses" class="nav-item"><i class="fas fa-book-open"></i><span>Курсы</span></a>
            <a href="/pages/admin/access" class="nav-item"><i class="fas fa-lock"></i><span>Доступы</span></a>
            <a href="/pages/admin/roles" class="nav-item"><i class="fas fa-tags"></i><span>Роли</span></a>
            <a href="/pages/admin/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Календарь</span></a>
            <a href="/pages/admin/status-logs" class="nav-item"><i class="fas fa-history"></i><span>Статусы</span></a>
            <a href="/pages/admin/profile" class="nav-item active"><i class="fas fa-user-cog"></i><span>Профиль</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="/pages/admin/setting" class="nav-item"><i class="fas fa-sliders-h"></i><span>Настройки</span></a>
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <h1><i class="fas fa-user-cog"></i> Профиль</h1>
            <button class="icon-btn" onclick="toggleTheme()" id="themeToggleBtn" title="Сменить тему"><i class="fas fa-moon"></i></button>
        </header>

        <div class="content">
            <div class="profile-card">
                <div class="profile-avatar" id="profileAvatar">А</div>
                <div class="profile-name" id="profileName">Загрузка...</div>
                <div class="profile-role" id="profileRole">Администратор</div>

                <div class="info-row"><span class="label">Имя пользователя</span><span class="value" id="profileUsername">—</span></div>
                <div class="info-row"><span class="label">Email</span><span class="value" id="profileEmail">—</span></div>
                <div class="info-row"><span class="label">Роль</span><span class="value" id="profileRoleText">—</span></div>
                <div class="info-row"><span class="label">Статус</span><span class="value" id="profileStatus">—</span></div>

                <div class="profile-actions">
                    <button class="btn btn-primary" onclick="openEditProfileModal()"><i class="fas fa-edit"></i> Редактировать</button>
                    <button class="btn btn-outline" onclick="openChangePasswordModal()"><i class="fas fa-key"></i> Сменить пароль</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактирования -->
    <div class="custom-modal-overlay" id="editProfileModal">
        <div class="custom-modal">
            <h3><i class="fas fa-edit"></i> Редактировать профиль</h3>
            <div class="form-group"><label>Полное имя</label><input type="text" id="editFullName"></div>
            <div class="form-group"><label>Email</label><input type="email" id="editEmail"></div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeEditProfileModal()">Отмена</button>
                <button class="btn btn-primary" onclick="saveProfile()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно смены пароля -->
    <div class="custom-modal-overlay" id="changePasswordModal">
        <div class="custom-modal">
            <h3><i class="fas fa-key"></i> Сменить пароль</h3>
            <div class="form-group"><label>Новый пароль (минимум 6 символов)</label><input type="password" id="newPassword"></div>
            <div class="form-group"><label>Повторите пароль</label><input type="password" id="confirmPassword"></div>
            <div class="modal-actions">
                <button class="btn btn-cancel" onclick="closeChangePasswordModal()">Отмена</button>
                <button class="btn btn-primary" onclick="savePassword()">Сменить</button>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('access_token');
        var userData = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !userData) { window.location.href = '/pages/login'; }
        if (userData.role !== 'admin') { window.location.href = '/pages/'; }

        function handleLogout() { localStorage.clear(); window.location.href = '/pages/login'; }

        function showToast(message, type) {
            var div = document.createElement('div');
            div.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;background:' + (type === 'success' ? '#4CAF50' : '#FF0000') + ';color:#fff;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 4px 16px rgba(0,0,0,0.2);';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(function() { div.remove(); }, 3000);
        }

        async function loadProfile() {
            try {
                var resp = await fetch('/api/v1/admin/users/' + userData.id, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (resp.ok) {
                    var user = await resp.json();
                    var initials = (user.full_name || user.username).split(' ').map(function(w) { return w[0]; }).join('').toUpperCase().slice(0, 2);
                    document.getElementById('profileAvatar').textContent = initials;
                    document.getElementById('profileName').textContent = user.full_name || user.username;
                    document.getElementById('profileUsername').textContent = user.username;
                    document.getElementById('profileEmail').textContent = user.email || '';
                    document.getElementById('profileRoleText').textContent = user.role === 'admin' ? 'Администратор' : user.role === 'trainer' ? 'Тренер' : 'Сотрудник';
                    document.getElementById('profileStatus').textContent = user.is_active ? 'Активен' : 'Заблокирован';
                }
            } catch (e) {}
        }

        function openEditProfileModal() {
            document.getElementById('editFullName').value = document.getElementById('profileName').textContent;
            document.getElementById('editEmail').value = document.getElementById('profileEmail').textContent;
            document.getElementById('editProfileModal').classList.add('show');
        }
        function closeEditProfileModal() { document.getElementById('editProfileModal').classList.remove('show'); }

        async function saveProfile() {
            var fullName = document.getElementById('editFullName').value.trim();
            var email = document.getElementById('editEmail').value.trim();
            if (!fullName || !email) { showToast('Заполните все поля', 'error'); return; }
            try {
                var resp = await fetch('/api/v1/admin/users/' + userData.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ full_name: fullName, email: email })
                });
                if (resp.ok) {
                    closeEditProfileModal();
                    loadProfile();
                    showToast('Профиль обновлён', 'success');
                } else {
                    var err = await resp.json();
                    showToast(err.detail || 'Ошибка', 'error');
                }
            } catch (e) { showToast(e.message, 'error'); }
        }

        function openChangePasswordModal() {
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('changePasswordModal').classList.add('show');
        }
        function closeChangePasswordModal() { document.getElementById('changePasswordModal').classList.remove('show'); }

        async function savePassword() {
            var newPass = document.getElementById('newPassword').value;
            var confirm = document.getElementById('confirmPassword').value;
            if (!newPass || !confirm) { showToast('Заполните все поля', 'error'); return; }
            if (newPass.length < 6) { showToast('Пароль минимум 6 символов', 'error'); return; }
            if (newPass !== confirm) { showToast('Пароли не совпадают', 'error'); return; }
            try {
                var resp = await fetch('/api/v1/admin/users/' + userData.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ password: newPass })
                });
                if (resp.ok) {
                    closeChangePasswordModal();
                    showToast('Пароль изменён', 'success');
                } else {
                    var err = await resp.json();
                    showToast(err.detail || 'Ошибка', 'error');
                }
            } catch (e) { showToast(e.message, 'error'); }
        }

        document.querySelectorAll('.custom-modal-overlay').forEach(function(overlay) {
            overlay.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('show'); });
        });

        // Тема
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') { document.body.classList.add('dark'); }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            var isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = isDark ? '☀️' : '🌙';
        }
        var themeBtn = document.getElementById('themeToggleBtn');
        if (themeBtn) themeBtn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';

        loadProfile();
    </script>
</body>
</html>
