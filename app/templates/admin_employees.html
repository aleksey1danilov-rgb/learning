<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сотрудники | Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f6fa;
            color: #1a1a1a;
            display: flex;
            min-height: 100vh;
        }

        /* САЙДБАР */
        .sidebar {
            width: 80px; height: 100vh; background: #ffffff; border-right: 1px solid #eaedf2;
            position: fixed; left: 0; top: 0; transition: width 0.3s; overflow: hidden;
            z-index: 1000; display: flex; flex-direction: column; box-shadow: 4px 0 16px rgba(0,0,0,0.04);
        }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 24px 16px 20px; border-bottom: 1px solid #eaedf2; flex-shrink: 0; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon { font-size: 32px; line-height: 1; flex-shrink: 0; }
        .sidebar-nav { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; color: #5a5e6a; text-decoration: none; transition: all 0.2s; white-space: nowrap; font-size: 14px; font-weight: 500; position: relative; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; color: #8a8f99; }
        .nav-item span { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; }
        .nav-item:hover { background: #f0f5ff; color: #0066ff; }
        .nav-item:hover i { color: #0066ff; }
        .nav-item.active { background: #e6f0ff; color: #0044cc; }
        .nav-item.active i { color: #0044cc; }
        .nav-item.active::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 28px; background: #0066ff; border-radius: 0 4px 4px 0; }
        .sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid #eaedf2; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
        .nav-item.logout { color: #FF0000; cursor: pointer; }
        .nav-item.logout:hover { background: #fff0f0; color: #d93636; }
        .nav-item.logout:hover i { color: #d93636; }

        /* ОСНОВНОЙ КОНТЕНТ */
        .main-content { margin-left: 80px; flex: 1; min-height: 100vh; transition: margin-left 0.3s; }
        .top-bar { background: #ffffff; padding: 14px 36px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eaedf2; position: sticky; top: 0; z-index: 100; }
        .top-bar-left { display: flex; align-items: center; gap: 20px; }
        .menu-toggle { display: none; flex-direction: column; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px; }
        .menu-toggle span { display: block; width: 24px; height: 2px; background: #1a1a1a; border-radius: 2px; }
        .top-bar-left h2 { font-size: 22px; font-weight: 800; color: #1a1a1a; }
        .top-bar-right { display: flex; align-items: center; gap: 24px; }
        .top-icon { color: #5a5e6a; font-size: 20px; cursor: pointer; position: relative; transition: color 0.2s; }
        .top-icon:hover { color: #0066ff; }
        .top-icon .dot { position: absolute; top: -4px; right: -6px; width: 8px; height: 8px; background: #FF0000; border-radius: 50%; border: 2px solid white; }
        .user-block { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 4px 12px 4px 4px; border-radius: 40px; transition: background 0.2s; margin-left: 8px; }
        .user-block:hover { background: #f0f2f5; }
        .user-avatar { width: 38px; height: 38px; border-radius: 50%; background: #7B3FAF; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; font-size: 16px; }
        .user-info { line-height: 1.3; }
        .user-name { font-size: 14px; font-weight: 600; color: #1a1a1a; }
        .user-role { font-size: 12px; color: #8a8f99; }

        .btn { padding: 8px 18px; border-radius: 8px; border: none; font-weight: 500; font-size: 13px; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: #0066ff; color: #fff; } .btn-primary:hover { background: #0052cc; }
        .btn-success { background: #4CAF50; color: #fff; } .btn-success:hover { background: #388E3C; }
        .btn-danger { background: #FF0000; color: #fff; } .btn-danger:hover { background: #d93636; }
        .btn-warning { background: #ff9800; color: #fff; } .btn-warning:hover { background: #e68900; }
        .btn-ghost { background: transparent; color: #5a5e6a; border: 1px solid #eaedf2; } .btn-ghost:hover { background: #f0f2f5; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }

        /* КОНТЕНТ */
        .content { padding: 28px 36px 60px; max-width: 1400px; margin: 0 auto; }
        .controls-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
        .search-box { display: flex; align-items: center; background: #ffffff; border: 1px solid #eaedf2; border-radius: 40px; padding: 0 18px; height: 42px; flex: 1; min-width: 250px; max-width: 400px; }
        .search-box i { color: #8a8f99; font-size: 16px; }
        .search-box input { border: none; background: transparent; padding: 0 12px; font-size: 14px; outline: none; width: 100%; font-family: 'Inter', sans-serif; color: #1a1a1a; }
        .search-box input::placeholder { color: #aaafb9; }
        .filter-tabs { display: flex; gap: 4px; background: #ffffff; border-radius: 12px; border: 1px solid #eaedf2; padding: 4px; }
        .filter-tab { padding: 8px 20px; border-radius: 8px; border: none; background: transparent; color: #5a5e6a; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; white-space: nowrap; }
        .filter-tab:hover { background: #f0f2f5; }
        .filter-tab.active { background: #e6f0ff; color: #0044cc; }

        /* ТАБЛИЦА */
        .table-container { background: #ffffff; border-radius: 16px; border: 1px solid #eaedf2; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
        .table-header { display: grid; grid-template-columns: 50px 1fr 1.5fr 130px 120px 110px 140px; gap: 16px; padding: 14px 20px; background: #f8f9fc; border-bottom: 1px solid #eaedf2; font-size: 11px; font-weight: 600; color: #8a8f99; text-transform: uppercase; letter-spacing: 0.5px; align-items: center; }
        .employee-row { display: grid; grid-template-columns: 50px 1fr 1.5fr 130px 120px 110px 140px; gap: 16px; padding: 12px 20px; border-bottom: 1px solid #f0f2f5; align-items: center; transition: background 0.15s; font-size: 14px; }
        .employee-row:hover { background: #fafbfc; }
        .employee-row:last-child { border-bottom: none; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; color: #fff; flex-shrink: 0; }
        .avatar.admin { background: #7B3FAF; } .avatar.employee { background: #4CAF50; } .avatar.trainer { background: #ff9800; }
        .name-cell { font-weight: 600; color: #1a1a1a; display: flex; align-items: center; gap: 8px; }
        .email-cell { color: #8a8f99; font-size: 13px; }
        .badge { padding: 3px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; white-space: nowrap; display: inline-block; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
        .badge-info { background: #e6f0ff; color: #0044cc; }
        .badge-warning { background: #fef3c7; color: #92400e; }
        .actions-cell { display: flex; gap: 6px; justify-content: flex-end; }
        .empty-state { text-align: center; padding: 60px 20px; color: #b0b8c4; }
        .empty-state i { font-size: 48px; display: block; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        /* МОДАЛКА */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(4px); padding: 20px; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #ffffff; border-radius: 16px; padding: 28px 32px; max-width: 460px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: modalSlideIn 0.3s ease; }
        @keyframes modalSlideIn { from { opacity: 0; transform: translateY(30px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .modal-box .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 14px; border-bottom: 1px solid #eaedf2; }
        .modal-box .modal-header h2 { font-size: 18px; font-weight: 700; color: #1a1a1a; }
        .modal-close { background: none; border: none; color: #8a8f99; font-size: 20px; cursor: pointer; padding: 2px 6px; border-radius: 6px; }
        .modal-close:hover { background: #f0f2f5; color: #1a1a1a; }
        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; font-weight: 600; color: #8a8f99; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #eaedf2; border-radius: 8px; font-size: 13px; font-family: 'Inter', sans-serif; background: #ffffff; color: #1a1a1a; transition: border-color 0.2s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #0066ff; }
        .form-group input::placeholder { color: #b0b8c4; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; padding-top: 14px; border-top: 1px solid #eaedf2; }

        /* ТОСТ */
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; }
        .toast { background: #1a1a1a; color: #fff; padding: 12px 18px; border-radius: 10px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); max-width: 380px; transform: translateX(120%); animation: slideInToast 0.3s ease forwards; display: flex; align-items: center; gap: 10px; }
        .toast.success { background: #4CAF50; } .toast.error { background: #FF0000; } .toast.warning { background: #ff9800; } .toast.info { background: #0066ff; }
        .toast .toast-icon { font-size: 16px; flex-shrink: 0; }
        .toast .toast-message { font-size: 13px; font-weight: 500; }
        .toast .toast-close { background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 14px; padding: 0 4px; }
        .toast .toast-close:hover { color: #fff; }
        .toast.hide { animation: slideOutToast 0.3s ease forwards; }
        @keyframes slideInToast { to { transform: translateX(0); } } @keyframes slideOutToast { to { transform: translateX(120%); } }

        @media (max-width: 768px) {
            .sidebar { width: 0; border: none; } .sidebar.open { width: 260px; }
            .main-content { margin-left: 0; }
            .menu-toggle { display: flex !important; }
            .content { padding: 14px; }
            .table-header, .employee-row { grid-template-columns: 40px 1fr 100px 80px; }
            .table-header > *:nth-child(3), .employee-row > *:nth-child(3),
            .table-header > *:nth-child(5), .employee-row > *:nth-child(5),
            .table-header > *:nth-child(6), .employee-row > *:nth-child(6),
            .table-header > *:nth-child(7), .employee-row > *:nth-child(7) { display: none; }
            .user-info { display: none; }
        }
    
        body.dark {
            background: #0d0d1a;
            color: #ffffff;
        }
        body.dark .sidebar,
        body.dark .top-bar { background: #1a1a2e !important; border-color: #2d2d44 !important; }
        body.dark .top-bar,
        body.dark .content > *,
        body.dark .table-container,
        body.dark .stat-card,
        body.dark .section-card,
        body.dark .course-card,
        body.dark .dash-card,
        body.dark .list-container,
        body.dark .search-box,
        body.dark .modal-box,
        body.dark .course-header,
        body.dark .modules-section,
        body.dark .user-header,
        body.dark .courses-section,
        body.dark .achievements-section,
        body.dark .profile-header,
        body.dark .stat-mini,
        body.dark .course-item,
        body.dark .week-grid-wrap,
        body.dark .mini-cal,
        body.dark .cal-top,
        body.dark .nav-buttons {
            background: #1a1a2e !important;
            border-color: #2d2d44 !important;
            color: #ffffff !important;
        }
        body.dark .nav-item {
            color: rgba(255,255,255,0.6) !important;
        }
        body.dark .nav-item:hover {
            background: rgba(255,255,255,0.06) !important;
            color: #fff !important;
        }
        body.dark .nav-item.active {
            background: rgba(108,62,184,0.2) !important;
            color: #9B6FE8 !important;
        }
        body.dark .stat-number,
        body.dark h1,
        body.dark h2,
        body.dark h3,
        body.dark .course-title,
        body.dark .li-title,
        body.dark .item-title,
        body.dark .cr-title {
            color: #ffffff !important;
        }
        body.dark .stat-label,
        body.dark .li-sub,
        body.dark .item-sub,
        body.dark .cr-meta,
        body.dark .desc,
        body.dark .email,
        body.dark .progress,
        body.dark .empty-state {
            color: rgba(255,255,255,0.4) !important;
        }
        body.dark input,
        body.dark select,
        body.dark textarea {
            background: rgba(255,255,255,0.04) !important;
            border-color: rgba(255,255,255,0.08) !important;
            color: rgba(255,255,255,0.8) !important;
        }
        body.dark table th {
            background: rgba(255,255,255,0.03) !important;
            color: rgba(255,255,255,0.4) !important;
        }
        body.dark table td {
            border-color: rgba(255,255,255,0.05) !important;
            color: rgba(255,255,255,0.8) !important;
        }
        body.dark table tr:hover td {
            background: rgba(255,255,255,0.03) !important;
        }
        .theme-toggle {
            position: relative;
            top: auto;
            right: auto;
            z-index: 9999;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #eaedf2;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        body.dark .theme-toggle {
            background: #1a1a2e;
            border-color: #2d2d44;
        }


        /* ===== DARK MODE FIXES ===== */
        body.dark .requests-list { background: transparent !important; }
        body.dark .request-item { background: #1a1a2e !important; border-color: #2d2d44 !important; color: #fff !important; }
        body.dark .request-item:hover { background: rgba(255,255,255,0.05) !important; }
        body.dark .request-name { color: #fff !important; }
        body.dark .request-email { color: rgba(255,255,255,0.4) !important; }
        body.dark .request-description { color: rgba(255,255,255,0.6) !important; }
        body.dark .request-meta { color: rgba(255,255,255,0.4) !important; }
        body.dark .table-container { background: #1a1a2e !important; border-color: #2d2d44 !important; }
        body.dark .table-header { background: rgba(255,255,255,0.03) !important; border-color: #2d2d44 !important; }
        body.dark .table-header h3 { color: #fff !important; }
        body.dark table th { background: rgba(255,255,255,0.03) !important; color: rgba(255,255,255,0.4) !important; border-color: #2d2d44 !important; }
        body.dark table td { background: transparent !important; color: rgba(255,255,255,0.8) !important; border-color: #2d2d44 !important; }
        body.dark table tr:hover td { background: rgba(255,255,255,0.03) !important; }
        body.dark .custom-modal { background: #1a1a2e !important; border: 1px solid #2d2d44 !important; color: #fff !important; }
        body.dark .custom-modal h3 { color: #fff !important; }
        body.dark .custom-modal .form-group label { color: rgba(255,255,255,0.5) !important; }
        body.dark .custom-modal .form-group input { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.8) !important; }
        body.dark .custom-modal .btn-cancel { background: rgba(255,255,255,0.06) !important; color: rgba(255,255,255,0.7) !important; }
        body.dark .btn-outline { border-color: rgba(255,255,255,0.2) !important; color: #9B6FE8 !important; }
        body.dark .btn-outline:hover { background: rgba(108,62,184,0.2) !important; }
        body.dark .theme-toggle { background: #1a1a2e !important; border-color: #2d2d44 !important; color: #fff !important; position: relative !important; top: auto !important; right: auto !important; }

    </style>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <!-- САЙДБАР -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/pages/admin" class="logo">
                <span class="logo-icon">🎓</span></span>
            </a>
        </div>
        <nav class="sidebar-nav">
            <a href="/pages/admin" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
            <a href="/pages/admin/stats" class="nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Дашборд</span>
            </a>

            <a href="/pages/admin/employees" class="nav-item active"><i class="fas fa-users"></i><span>Сотрудники</span></a>
            <a href="/pages/admin/courses" class="nav-item"><i class="fas fa-plus-circle"></i><span>Курсы</span></a>
            <a href="/pages/admin/access" class="nav-item"><i class="fas fa-lock"></i><span>Доступы</span></a>
            <a href="/pages/admin/roles" class="nav-item"><i class="fas fa-tags"></i><span>Роли</span></a>
            <a href="/pages/admin/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Календарь</span></a>
            <a href="/pages/admin/status-logs" class="nav-item">
                <i class="fas fa-history"></i>
                <span>Статусы</span>
            </a>

            <a href="/pages/admin/profile" class="nav-item"><i class="fas fa-user-cog"></i><span>Профиль</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="/pages/setting" class="nav-item"><i class="fas fa-sliders-h"></i><span>Настройки</span></a>
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
        </div>
    </aside>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="main-content">
        <header class="top-bar">
            <div class="top-bar-left">
                <button class="menu-toggle" id="menuToggle">
                    <span></span><span></span><span></span>
                </button>
                <h2><i class="fas fa-users"></i> Сотрудники</h2>
            </div>
            <div class="top-bar-right">
                <div class="top-icon"><i class="fas fa-bell"></i><span class="dot"></span></div>
                <div class="top-icon"><i class="fas fa-comment-dots"></i></div>
                <div class="user-block">
                    <div class="user-avatar" id="userAvatar">А</div>
                    <div class="user-info">
                        <div class="user-name" id="userName">Администратор</div>
                        <div class="user-role" id="userRole">Админ</div>
                    </div>
                    <i class="fas fa-chevron-down" style="color:#aaafb9;font-size:11px;"></i>
                </div>
            </div>
        </header>

        <div class="content">
            <div class="controls-bar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск по имени или email..." id="searchInput">
                </div>
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">Все</button>
                    <button class="filter-tab" data-filter="active">Активные</button>
                    <button class="filter-tab" data-filter="blocked">Заблокированы</button>
                </div>
                <button class="btn btn-primary" onclick="openCreateModal()"><i class="fas fa-plus-circle"></i> Добавить сотрудника</button>
                <span style="font-size:13px;color:#8a8f99;margin-left:auto;" id="countLabel">0 сотрудников</span>
            </div>

            <div class="table-container">
                <div class="table-header">
                    <span></span>
                    <span>Имя</span>
                    <span>Email</span>
                    <span>Роль</span>
                    <span>Статус</span>
                    <span>Дата</span>
                    <span style="text-align:right;">Действия</span>
                </div>
                <div id="employeesList"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА СОЗДАНИЯ/РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="modalTitle">Добавить сотрудника</h2>
                <button class="modal-close" onclick="closeEditModal()"><i class="fas fa-times"></i></button>
            </div>
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" id="editUsername" placeholder="username">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="editEmail" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Полное имя</label>
                <input type="text" id="editFullName" placeholder="Иван Иванов">
            </div>
            <div class="form-group" id="passwordGroup">
                <label>Пароль</label>
                <input type="password" id="editPassword" placeholder="Не менее 6 символов">
            </div>
            <div class="form-group">
                <label>Роль</label>
                <select id="editRole">
                    <option value="employee">Сотрудник</option>
                    <option value="trainer">Тренер</option>
                    <option value="admin">Администратор</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn btn-ghost" onclick="closeEditModal()">Отмена</button>
                <button class="btn btn-primary" id="saveBtn" onclick="saveEmployee()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box" style="max-width:400px;text-align:center;">
            <div style="font-size:44px;color:#ff9800;margin-bottom:10px;"><i class="fas fa-exclamation-triangle"></i></div>
            <h2 style="margin-bottom:8px;color:#1a1a1a;" id="confirmTitle">Подтверждение</h2>
            <p style="color:#5a5e6a;font-size:14px;margin-bottom:20px;" id="confirmMessage">Вы уверены?</p>
            <div class="modal-actions" style="justify-content:center;">
                <button class="btn btn-ghost" onclick="closeConfirmModal()">Отмена</button>
                <button class="btn btn-danger" id="confirmBtn" onclick="executeConfirm()">Удалить</button>
            </div>
        </div>
    </div>

    <script>

// Перехват 401 - перенаправляем на страницу нет доступа
const originalFetch = window.fetch;
window.fetch = function(...args) {
    return originalFetch.apply(this, args).then(function(response) {
        if (response.status === 401) {
            window.location.href = '/pages/401';
        }
        return response;
    });
};


        // ===== АВТОРИЗАЦИЯ =====
        const token = localStorage.getItem('access_token');
        const userData = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !userData || userData.role !== 'admin') {
            window.location.href = userData ? '/pages/' : '/pages/login';
        }

        document.getElementById('userName').textContent = userData.full_name || userData.username;
        document.getElementById('userRole').textContent = userData.role === 'admin' ? 'Администратор' : (userData.role === 'trainer' ? 'Тренер' : 'Сотрудник');
        const initials = (userData.full_name || userData.username).split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
        document.getElementById('userAvatar').textContent = initials;

        // ===== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ =====
        let allUsers = [];
        let currentFilter = 'all';
        let editingUserId = null;
        let confirmCallback = null;

        // ===== TOAST =====
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const icons = { success: 'fa-check-circle', error: 'fa-times-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<span class="toast-icon"><i class="fas ${icons[type] || icons.info}"></i></span><span class="toast-message">${message}</span><button class="toast-close" onclick="this.parentElement.remove()">&times;</button>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 400); }, 4000);
        }

        // ===== МОДАЛКА ПОДТВЕРЖДЕНИЯ =====
        function showConfirm(title, message, onConfirm, confirmText = 'Удалить') {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            document.getElementById('confirmBtn').textContent = confirmText;
            document.getElementById('confirmModal').classList.add('show');
            confirmCallback = onConfirm;
        }
        function closeConfirmModal() { document.getElementById('confirmModal').classList.remove('show'); confirmCallback = null; }
        function executeConfirm() { document.getElementById('confirmModal').classList.remove('show'); if (confirmCallback) { confirmCallback(); confirmCallback = null; } }

        // ===== API =====
        async function apiFetch(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`, ...(options.headers || {}) }
            });
            if (!response.ok) {
                const error = await response.json().catch(() => ({ detail: 'Ошибка' }));
                throw new Error(error.detail || 'Ошибка запроса');
            }
            return response.json();
        }

        // ===== ЗАГРУЗКА =====
        async function loadUsers() {
            try {
                allUsers = await apiFetch('/api/v1/admin/users');
                renderUsers();
            } catch (error) {
                showToast('Ошибка загрузки: ' + error.message, 'error');
                document.getElementById('employeesList').innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Ошибка загрузки</p></div>';
            }
        }

        function renderUsers() {
            let users = allUsers;
            
            if (currentFilter === 'active') users = users.filter(u => u.is_active);
            else if (currentFilter === 'blocked') users = users.filter(u => !u.is_active);
            
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (query) {
                users = users.filter(u => 
                    (u.full_name || '').toLowerCase().includes(query) ||
                    u.email.toLowerCase().includes(query) ||
                    u.username.toLowerCase().includes(query)
                );
            }
            
            document.getElementById('countLabel').textContent = `${users.length} сотрудников`;
            
            const list = document.getElementById('employeesList');
            if (users.length === 0) {
                list.innerHTML = `<div class="empty-state"><i class="fas fa-user-slash"></i><p>Нет сотрудников</p></div>`;
                return;
            }

            const roleLabels = { admin: 'Админ', employee: 'Сотрудник', trainer: 'Тренер' };
            const roleBadges = { admin: 'badge-info', employee: 'badge-success', trainer: 'badge-warning' };
            
            list.innerHTML = users.map(u => {
                const initials = (u.full_name || u.username).split(' ').map(w => w[0]).join('').toUpperCase().slice(0, 2);
                const isMe = u.id === userData.id;
                return `
                    <div class="employee-row">
                        <div class="avatar ${u.role}">${initials}</div>
                        <div class="name-cell">
                            ${u.full_name || u.username}
                            ${isMe ? '<span style="font-size:10px;color:#b0b8c4;margin-left:4px;">(вы)</span>' : ''}
                        </div>
                        <div class="email-cell">${u.email}</div>
                        <div><span class="badge ${roleBadges[u.role] || 'badge-info'}">${roleLabels[u.role] || u.role}</span></div>
                        <div><span class="badge ${u.is_active ? 'badge-success' : 'badge-danger'}">${u.is_active ? 'Активен' : 'Заблокирован'}</span></div>
                        <div style="font-size:12px;color:#8a8f99;">${new Date(u.created_at).toLocaleDateString('ru-RU')}</div>
                        <div class="actions-cell">
                            <button class="btn btn-sm btn-ghost" onclick="openEditModal(${u.id})" title="Редактировать"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm ${u.is_active ? 'btn-warning' : 'btn-success'}" onclick="toggleUser(${u.id})" title="${u.is_active ? 'Заблокировать' : 'Разблокировать'}">
                                <i class="fas fa-${u.is_active ? 'ban' : 'check'}"></i>
                            </button>
                            ${!isMe ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})" title="Удалить"><i class="fas fa-trash"></i></button>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ===== ФИЛЬТРЫ И ПОИСК =====
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                renderUsers();
            });
        });
        document.getElementById('searchInput').addEventListener('input', renderUsers);

        // ===== МОДАЛКА =====
        function openCreateModal() {
            editingUserId = null;
            document.getElementById('modalTitle').textContent = 'Добавить сотрудника';
            document.getElementById('editUsername').value = '';
            document.getElementById('editEmail').value = '';
            document.getElementById('editFullName').value = '';
            document.getElementById('editPassword').value = '';
            document.getElementById('editRole').value = 'employee';
            document.getElementById('passwordGroup').style.display = 'block';
            document.getElementById('saveBtn').textContent = 'Создать';
            document.getElementById('editModal').classList.add('show');
            document.getElementById('editUsername').focus();
        }

        function openEditModal(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            editingUserId = userId;
            document.getElementById('modalTitle').textContent = 'Редактировать сотрудника';
            document.getElementById('editUsername').value = user.username || '';
            document.getElementById('editEmail').value = user.email || '';
            document.getElementById('editFullName').value = user.full_name || '';
            document.getElementById('editPassword').value = '';
            document.getElementById('editRole').value = user.role || 'employee';
            document.getElementById('passwordGroup').style.display = 'none';
            document.getElementById('saveBtn').textContent = 'Сохранить';
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            editingUserId = null;
        }

        async function saveEmployee() {
            const username = document.getElementById('editUsername').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const full_name = document.getElementById('editFullName').value.trim();
            const role = document.getElementById('editRole').value;
            const password = document.getElementById('editPassword').value.trim();

            if (!username || !email) { showToast('Заполните имя пользователя и email', 'warning'); return; }

            try {
                if (editingUserId) {
                    const data = { username, email, full_name, role };
                    await apiFetch(`/api/v1/admin/users/${editingUserId}`, { method: 'PUT', body: JSON.stringify(data) });
                    showToast('<i class="fas fa-check"></i> Сотрудник обновлён', 'success');
                } else {
                    if (!password || password.length < 6) { showToast('Пароль должен быть не менее 6 символов', 'warning'); return; }
                    const data = { username, email, full_name, role, password, is_active: true };
                    await apiFetch('/api/v1/admin/users', { method: 'POST', body: JSON.stringify(data) });
                    showToast('<i class="fas fa-check"></i> Сотрудник создан', 'success');
                }
                closeEditModal();
                await loadUsers();
            } catch (error) {
                showToast('❌ ' + error.message, 'error');
            }
        }

        // ===== БЛОКИРОВКА =====
        async function toggleUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            const action = user.is_active ? 'заблокировать' : 'разблокировать';
            showConfirm(
                user.is_active ? 'Заблокировать сотрудника?' : 'Разблокировать сотрудника?',
                `${user.full_name || user.username} будет ${action}.`,
                async () => {
                    try {
                        await apiFetch(`/api/v1/admin/users/${userId}`, {
                            method: 'PUT',
                            body: JSON.stringify({ is_active: !user.is_active })
                        });
                        showToast(`<i class="fas fa-check"></i> Сотрудник ${action}`, 'success');
                        await loadUsers();
                    } catch (error) {
                        showToast('❌ ' + error.message, 'error');
                    }
                },
                user.is_active ? 'Заблокировать' : 'Разблокировать'
            );
        }

        // ===== УДАЛЕНИЕ =====
        async function deleteUser(userId) {
            const user = allUsers.find(u => u.id === userId);
            if (!user) return;
            
            showConfirm(
                'Удалить сотрудника?',
                `"${user.full_name || user.username}" будет удалён безвозвратно.`,
                async () => {
                    try {
                        await apiFetch(`/api/v1/admin/users/${userId}`, { method: 'DELETE' });
                        showToast('<i class="fas fa-check"></i> Сотрудник удалён', 'success');
                        await loadUsers();
                    } catch (error) {
                        showToast('❌ ' + error.message, 'error');
                    }
                }
            );
        }

        function handleLogout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user');
            window.location.href = '/pages/login';
        }

        // ===== МОБИЛЬНОЕ МЕНЮ =====
        document.getElementById('menuToggle').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });
        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('menuToggle');
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(event.target) && !toggle.contains(event.target)) {
                    sidebar.classList.remove('open');
                }
            }
        });

        loadUsers();
    
        // Тёмная тема
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            var isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = isDark ? '☀️' : '🌙';
        }
        // Добавляем кнопку переключения
        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.createElement('button');
            btn.className = 'theme-toggle';
            btn.id = 'themeToggleBtn';
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            btn.onclick = toggleTheme;
            var topBarRight = document.querySelector('.top-bar-right');
            if (topBarRight) { topBarRight.appendChild(btn); } else { document.body.appendChild(btn); }
        });

</script>
</body>
</html>
