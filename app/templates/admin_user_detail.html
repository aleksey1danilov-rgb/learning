<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сотрудник | Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f6fa; color: #1a1a1a; display: flex; min-height: 100vh; }
        .sidebar { width: 80px; height: 100vh; background: #fff; border-right: 1px solid #eaedf2; position: fixed; left: 0; top: 0; transition: width 0.3s; overflow: hidden; z-index: 1000; display: flex; flex-direction: column; }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 24px 16px 20px; border-bottom: 1px solid #eaedf2; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon { font-size: 32px; }
        .sidebar-nav { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; color: #5a5e6a; text-decoration: none; transition: all 0.2s; white-space: nowrap; font-size: 14px; font-weight: 500; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; color: #8a8f99; }
        .nav-item span { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; }
        .nav-item:hover { background: #f0f5ff; color: #0066ff; }
        .nav-item.active { background: #e6f0ff; color: #0044cc; }
        .sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid #eaedf2; }
        .nav-item.logout { color: #FF6161; cursor: pointer; }
        .main-content { margin-left: 80px; flex: 1; }
        .top-bar { background: #fff; padding: 12px 28px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #eaedf2; position: sticky; top: 0; z-index: 100; }
        .back-btn { color: #0066ff; text-decoration: none; font-size: 14px; font-weight: 500; }
        .top-bar h1 { font-size: 18px; font-weight: 900; }
        .content { padding: 24px 32px; max-width: 1000px; margin: 0 auto; }

        .user-header { display: flex; gap: 24px; background: #fff; border-radius: 16px; padding: 24px; border: 1px solid #eaedf2; margin-bottom: 20px; align-items: center; }
        .user-avatar-large { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 24px; color: #fff; flex-shrink: 0; }
        .user-info { flex: 1; }
        .user-info h1 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
        .user-info .email { font-size: 14px; color: #5a5e6a; margin-bottom: 10px; }
        .user-info .stats-row { display: flex; gap: 16px; }
        .user-info .stat-item { font-size: 13px; }
        .user-info .stat-item strong { font-size: 16px; }
        .export-btn { background: #4CAF50; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; font-family: 'Roboto', sans-serif; }

        .courses-section { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; padding: 20px; }
        .courses-section h2 { font-size: 16px; font-weight: 700; margin-bottom: 14px; }
        .course-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; border: 1px solid #eaedf2; margin-bottom: 8px; cursor: pointer; transition: all 0.2s; }
        .course-card:hover { border-color: #0066ff; box-shadow: 0 2px 8px rgba(0,102,255,0.08); }
        .course-cover-sm { width: 80px; aspect-ratio: 16/9; border-radius: 6px; overflow: hidden; background: #e8ecf1; flex-shrink: 0; }
        .course-cover-sm img { width: 100%; height: 100%; object-fit: cover; }
        .course-cover-sm .no-cover { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #b0b8c4; }
        .course-info { flex: 1; }
        .course-info h3 { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
        .progress-bar { width: 100%; height: 5px; background: #eaedf2; border-radius: 3px; overflow: hidden; margin-top: 6px; }
        .progress-fill { height: 100%; border-radius: 3px; }
        .badge { font-size: 10px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-orange { background: #fef3c7; color: #92400e; }
        .empty-state { text-align: center; padding: 30px; color: #8a8f99; }
    </style>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a href="/pages/admin" class="logo"><span class="logo-icon"><span style="font-size:32px;line-height:1;">🎓</span></span></a></div>
        <nav class="sidebar-nav">
            <a href="/pages/admin" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
            <a href="/pages/admin/stats" class="nav-item active"><i class="fas fa-chart-bar"></i><span>Дашборд</span></a>
            <a href="/pages/admin/employees" class="nav-item"><i class="fas fa-users"></i><span>Сотрудники</span></a>
            <a href="/pages/admin/courses" class="nav-item"><i class="fas fa-plus-circle"></i><span>Курсы</span></a>
            <a href="/pages/admin/access" class="nav-item"><i class="fas fa-lock"></i><span>Доступы</span></a>
            <a href="/pages/admin/roles" class="nav-item"><i class="fas fa-tags"></i><span>Роли</span></a>
            <a href="/pages/admin/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Календарь</span></a>
            <a href="/pages/admin/profile" class="nav-item"><i class="fas fa-user-cog"></i><span>Профиль</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <a href="/pages/admin/stats" class="back-btn"><i class="fas fa-arrow-left"></i> Назад</a>
            <h1 id="pageTitle">Сотрудник</h1>
        </header>

        <div class="content">
            <div class="user-header" id="userHeader">
                <div class="user-avatar-large" id="userAvatarLarge">A</div>
                <div class="user-info">
                    <h1 id="userName">Загрузка...</h1>
                    <div class="email" id="userEmail"></div>
                    <div class="stats-row">
                        <div class="stat-item"><strong id="userCompleted">0</strong> пройдено</div>
                        <div class="stat-item"><strong id="userAssigned">0</strong> назначено</div>
                    </div>
                </div>
                <button class="export-btn" onclick="exportExcel()"><i class="fas fa-chart-bar"></i> Экспорт</button>
            </div>

            <div class="courses-section">
                <h2><i class="fas fa-book-open"></i> Курсы сотрудника</h2>
                <div id="coursesList">
                    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('access_token');
        var userData = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !userData || userData.role !== 'admin') { window.location.href = '/pages/'; }
        function handleLogout() { localStorage.clear(); window.location.href = '/pages/login'; }

        var pathParts = window.location.pathname.split('/');
        var userId = pathParts[pathParts.length - 1];
        var currentUserData = null;

        function apiGet(url) {
            return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function(r) { return r.ok ? r.json() : []; })
                .catch(function() { return []; });
        }

        function loadData() {
            Promise.all([
                apiGet('/api/v1/admin/users'),
                apiGet('/api/v1/admin/courses'),
                apiGet('/api/v1/admin/assignments')
            ]).then(function(data) {
                var users = data[0], courses = data[1], assignments = data[2];
                currentUserData = users.find(function(u){return u.id == userId;});
                
                if (!currentUserData) {
                    document.getElementById('userName').textContent = 'Не найден';
                    return;
                }
                
                document.getElementById('pageTitle').textContent = '<i class="fas fa-user-tie"></i> ' + (currentUserData.full_name || currentUserData.username);
                document.getElementById('userName').textContent = currentUserData.full_name || currentUserData.username;
                document.getElementById('userEmail').textContent = currentUserData.email || '';
                document.getElementById('userAvatarLarge').textContent = (currentUserData.full_name || currentUserData.username).split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
                
                var userAssignments = assignments.filter(function(a){return a.user_id == userId;});
                var completedCount = userAssignments.filter(function(a){return a.status === 'completed';}).length;
                document.getElementById('userCompleted').textContent = completedCount;
                document.getElementById('userAssigned').textContent = userAssignments.length;
                
                var container = document.getElementById('coursesList');
                if (!userAssignments.length) {
                    container.innerHTML = '<div class="empty-state"><i class="fas fa-book"></i><p>Нет назначенных курсов</p></div>';
                    return;
                }
                
                var colors = ['#0066ff','#4CAF50','#e67e22','#7B3FAF','#c62828','#0d47a1'];
                var html = '';
                
                userAssignments.forEach(function(a, i) {
                    var course = courses.find(function(c){return c.id === a.course_id;});
                    if (!course) return;
                    
                    // Загружаем прогресс
                    apiGet('/api/v1/admin/my/progress?course_id=' + a.course_id).then(function(progress) {
                        var userProgress = progress.filter(function(p){return p.user_id == userId;});
                        var completed = userProgress.filter(function(p){return p.is_completed;}).length;
                        var total = userProgress.length;
                        var percent = total > 0 ? Math.round((completed / total) * 100) : 0;
                        
                        var coverHtml = course.image_url && course.image_url.length > 100 ? '<img src="' + course.image_url + '">' : '<div class="no-cover"><span style="font-size:32px;line-height:1;">🎓</span></div>';
                        var badge = a.status === 'completed' || percent === 100 ? '<span class="badge badge-green"><i class="fas fa-check"></i> Завершён</span>' : '<span class="badge badge-orange"><i class="fas fa-book"></i> ' + percent + '%</span>';
                        
                        var card = document.createElement('div');
                        card.className = 'course-card';
                        card.onclick = function() { window.location.href = '/pages/admin/course-detail/' + course.id; };
                        card.innerHTML = '<div class="course-cover-sm">' + coverHtml + '</div>' +
                            '<div class="course-info"><h3>' + course.title + '</h3>' +
                            '<div class="progress-bar"><div class="progress-fill" style="width:' + percent + '%;background:' + colors[i % colors.length] + ';"></div></div></div>' +
                            badge;
                        container.appendChild(card);
                    });
                });
                
                if (html) container.innerHTML = html;
            });
        }

        function exportExcel() {
            var table = document.createElement('table');
            table.innerHTML = '<tr><th>Курс</th><th>Статус</th></tr>';
            
            var courses = document.querySelectorAll('.course-card');
            courses.forEach(function(card) {
                var title = card.querySelector('h3') ? card.querySelector('h3').textContent : '';
                var badge = card.querySelector('.badge') ? card.querySelector('.badge').textContent : '';
                table.innerHTML += '<tr><td>' + title + '</td><td>' + badge + '</td></tr>';
            });
            
            var html = '<table>' + table.innerHTML + '</table>';
            var blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'user_' + userId + '_stats.xls';
            a.click();
        }

        loadData();
    </script>
</body>
</html>
