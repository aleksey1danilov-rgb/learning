<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Роли | Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f6fa; color: #1a1a1a; display: flex; min-height: 100vh; }
        .sidebar { width: 80px; height: 100vh; background: #fff; border-right: 1px solid #eaedf2; position: fixed; left: 0; top: 0; transition: width 0.3s; overflow: hidden; z-index: 1000; display: flex; flex-direction: column; }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 24px 16px 20px; border-bottom: 1px solid #eaedf2; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon { font-size: 32px; }
        .sidebar-nav { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; color: #5a5e6a; text-decoration: none; transition: all 0.2s; white-space: nowrap; font-size: 14px; font-weight: 500; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; color: #8a8f99; }
        .nav-item span { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; }
        .nav-item:hover { background: #f0f5ff; color: #0066ff; }
        .nav-item.active { background: #e6f0ff; color: #0044cc; }
        .sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid #eaedf2; }
        .nav-item.logout { color: #FF6161; cursor: pointer; }
        
        .main-content { margin-left: 80px; flex: 1; min-height: 100vh; }
        .top-bar { background: #fff; padding: 12px 28px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #eaedf2; position: sticky; top: 0; z-index: 100; }
        .top-bar h1 { font-size: 20px; font-weight: 900; margin-right: auto; }
        
        .content { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
        
        .roles-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-bottom: 28px; }
        .role-card { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; padding: 24px; transition: all 0.3s; }
        .role-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.06); transform: translateY(-2px); }
        .role-card .role-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 12px; }
        .role-card .role-icon.employee { background: #e8f5e9; color: #2e7d32; }
        .role-card .role-icon.trainer { background: #fff3e0; color: #e65100; }
        .role-card .role-icon.admin { background: #e6f0ff; color: #0044cc; }
        .role-card h3 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
        .role-card .role-desc { font-size: 13px; color: #8a8f99; margin-bottom: 14px; line-height: 1.4; }
        .role-card .perm-list { display: flex; flex-wrap: wrap; gap: 6px; }
        .role-card .perm-badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #f0f2f5; color: #5a5e6a; font-weight: 500; }
        
        .table-container { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; overflow: hidden; }
        .table-header { padding: 16px 24px; background: #f8f9fb; border-bottom: 1px solid #eaedf2; }
        .table-header h3 { font-size: 16px; font-weight: 600; }
        table { width: 100%; border-collapse: collapse; }
        table th { text-align: left; padding: 14px 20px; font-size: 12px; font-weight: 600; color: #8a8f99; text-transform: uppercase; border-bottom: 1px solid #eaedf2; }
        table td { padding: 14px 20px; font-size: 14px; border-bottom: 1px solid #f0f2f5; }
        table tr:hover td { background: #f8f9fb; }
        
        .role-select { padding: 6px 12px; border-radius: 8px; border: 2px solid #eaedf2; font-family: 'Roboto', sans-serif; font-size: 13px; background: #fff; cursor: pointer; }
        .role-select:focus { outline: none; border-color: #0066ff; }
        
        .btn { padding: 8px 16px; border-radius: 8px; border: none; font-weight: 600; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: 'Roboto', sans-serif; }
        .btn-primary { background: #0066ff; color: #fff; }
        .btn-primary:hover { background: #0052cc; }
        
        .role-badge { padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .role-badge.admin { background: #e6f0ff; color: #0044cc; }
        .role-badge.trainer { background: #fff3e0; color: #e65100; }
        .role-badge.employee { background: #e8f5e9; color: #2e7d32; }
        
        body.dark { background: #0d0d1a; color: #ffffff; }
        body.dark .sidebar, body.dark .top-bar, body.dark .role-card, body.dark .table-container { background: #1a1a2e !important; border-color: #2d2d44 !important; color: #fff !important; }
        body.dark .nav-item { color: rgba(255,255,255,0.6) !important; }
        body.dark .nav-item:hover { background: rgba(255,255,255,0.06) !important; color: #fff !important; }
        body.dark .nav-item.active { background: rgba(108,62,184,0.2) !important; color: #9B6FE8 !important; }
        body.dark .role-desc { color: rgba(255,255,255,0.4) !important; }
        body.dark .perm-badge { background: rgba(255,255,255,0.06) !important; color: rgba(255,255,255,0.6) !important; }
        body.dark .table-header { background: rgba(255,255,255,0.03) !important; }
        body.dark table th { color: rgba(255,255,255,0.4) !important; }
        body.dark table td { border-color: #2d2d44 !important; color: rgba(255,255,255,0.8) !important; }
        body.dark .role-select { background: rgba(255,255,255,0.05) !important; border-color: rgba(255,255,255,0.1) !important; color: rgba(255,255,255,0.8) !important; }
    </style>
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a href="/pages/admin" class="logo"><span class="logo-icon">🎓</span></a></div>
        <nav class="sidebar-nav">
            <a href="/pages/admin" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
            <a href="/pages/admin/stats" class="nav-item"><i class="fas fa-chart-bar"></i><span>Дашборд</span></a>
            <a href="/pages/admin/employees" class="nav-item"><i class="fas fa-users"></i><span>Сотрудники</span></a>
            <a href="/pages/admin/courses" class="nav-item"><i class="fas fa-book-open"></i><span>Курсы</span></a>
            <a href="/pages/admin/access" class="nav-item"><i class="fas fa-lock"></i><span>Доступы</span></a>
            <a href="/pages/admin/roles" class="nav-item active"><i class="fas fa-tags"></i><span>Роли</span></a>
            <a href="/pages/admin/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Календарь</span></a>
            <a href="/pages/admin/status-logs" class="nav-item"><i class="fas fa-history"></i><span>Статусы</span></a>
            <a href="/pages/admin/profile" class="nav-item"><i class="fas fa-user-cog"></i><span>Профиль</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="/pages/admin/setting" class="nav-item"><i class="fas fa-sliders-h"></i><span>Настройки</span></a>
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <h1><i class="fas fa-tags"></i> Роли и права</h1>
        </header>

        <div class="content">
            <div class="roles-grid" id="rolesGrid"></div>

            <div class="table-container">
                <div class="table-header">
                    <h3><i class="fas fa-users"></i> Пользователи и их роли</h3>
                </div>
                <table>
                    <thead>
                        <tr><th>ID</th><th>Имя</th><th>Email</th><th>Текущая роль</th><th>Изменить роль</th></tr>
                    </thead>
                    <tbody id="usersTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('access_token');
        const userData = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !userData || userData.role !== 'admin') { window.location.href = '/pages/401'; }

        function handleLogout() { localStorage.clear(); window.location.href = '/pages/login'; }

        function showToast(message, type) {
            const div = document.createElement('div');
            div.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:12px 20px;border-radius:8px;background:' + (type === 'success' ? '#4CAF50' : '#FF0000') + ';color:#fff;font-size:14px;font-weight:600;z-index:99999;';
            div.textContent = message;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 3000);
        }

        const roleLabels = {
            'employee': 'Сотрудник',
            'trainer': 'Тренер',
            'admin': 'Администратор'
        };

        const roleIcons = {
            'employee': '<i class="fas fa-user"></i>',
            'trainer': '<i class="fas fa-chalkboard-teacher"></i>',
            'admin': '<i class="fas fa-shield-alt"></i>'
        };

        const rolePerms = {
            'employee': ['Просмотр курсов', 'Календарь', 'Прохождение уроков'],
            'trainer': ['Просмотр курсов', 'Календарь', 'Прохождение уроков', 'Создание курсов', 'Редактирование курсов', 'Создание событий', 'Редактирование событий'],
            'admin': ['Полный доступ', 'Управление пользователями', 'Управление ролями', 'Статистика']
        };

        async function apiFetch(url, options = {}) {
            const response = await fetch(url, {
                ...options,
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(options.headers || {}) }
            });
            if (!response.ok) { const error = await response.json().catch(() => ({ detail: 'Ошибка' })); throw new Error(error.detail || 'Ошибка'); }
            return response.json();
        }

        function renderRoles() {
            const container = document.getElementById('rolesGrid');
            const roles = ['employee', 'trainer', 'admin'];
            container.innerHTML = roles.map(function(role) {
                return '<div class="role-card">' +
                    '<div class="role-icon ' + role + '">' + (roleIcons[role] || '') + '</div>' +
                    '<h3>' + (roleLabels[role] || role) + '</h3>' +
                    '<div class="role-desc">' + (role === 'employee' ? 'Базовый доступ к платформе' : role === 'trainer' ? 'Расширенные права на создание контента' : 'Полный административный доступ') + '</div>' +
                    '<div class="perm-list">' + (rolePerms[role] || []).map(function(p) { return '<span class="perm-badge">' + p + '</span>'; }).join('') + '</div>' +
                    '</div>';
            }).join('');
        }

        async function loadUsers() {
            try {
                const users = await apiFetch('/api/v1/admin/users');
                const tbody = document.getElementById('usersTableBody');
                tbody.innerHTML = users.map(function(u) {
                    const currentRole = u.role || 'employee';
                    return '<tr>' +
                        '<td>' + u.id + '</td>' +
                        '<td><strong>' + (u.full_name || u.username) + '</strong></td>' +
                        '<td>' + (u.email || '') + '</td>' +
                        '<td><span class="role-badge ' + currentRole + '">' + (roleLabels[currentRole] || currentRole) + '</span></td>' +
                        '<td>' +
                        '<select class="role-select" onchange="changeRole(' + u.id + ', this.value)" ' + (u.id === 1 ? 'disabled' : '') + '>' +
                        '<option value="employee" ' + (currentRole === 'employee' ? 'selected' : '') + '>Сотрудник</option>' +
                        '<option value="trainer" ' + (currentRole === 'trainer' ? 'selected' : '') + '>Тренер</option>' +
                        '<option value="admin" ' + (currentRole === 'admin' ? 'selected' : '') + '>Администратор</option>' +
                        '</select>' +
                        '</td>' +
                        '</tr>';
                }).join('');
            } catch (e) {
                showToast(e.message, 'error');
            }
        }

        async function changeRole(userId, newRole) {
            try {
                await apiFetch('/api/v1/admin/users/' + userId + '/role', {
                    method: 'PUT',
                    body: JSON.stringify({ role: newRole })
                });
                showToast('Роль обновлена', 'success');
                loadUsers();
            } catch (e) {
                showToast(e.message, 'error');
                loadUsers();
            }
        }

        renderRoles();
        loadUsers();
    </script>
</body>
</html>
