<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нет доступа | LearnHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f6fa; color: #1a1a1a; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; max-width: 500px; padding: 40px; background: #fff; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.08); }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 24px; font-weight: 900; margin-bottom: 12px; color: #1a1a1a; }
        p { font-size: 14px; color: #8a8f99; margin-bottom: 24px; line-height: 1.5; }
        .btn { display: inline-block; padding: 12px 28px; background: #0066ff; color: #fff; text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 600; transition: all 0.2s; }
        .btn:hover { background: #0052cc; box-shadow: 0 4px 12px rgba(0,102,255,0.3); }
        body.dark { background: #0d0d1a; }
        body.dark .container { background: #1a1a2e; }
        body.dark h1 { color: #fff; }
        body.dark p { color: rgba(255,255,255,0.5); }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔒</div>
        <h1>Нет доступа</h1>
        <p>Ваша учетная запись не обладает правами для просмотра этой страницы. Обратитесь к администратору для получения доступа.</p>
        <a href="/pages/" class="btn">← На главную</a>
    </div>
</body>
</html>
