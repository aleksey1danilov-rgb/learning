<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд | Админ-панель</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Roboto', sans-serif; background: #f5f6fa; color: #1a1a1a; display: flex; min-height: 100vh; }
        .sidebar { width: 80px; height: 100vh; background: #fff; border-right: 1px solid #eaedf2; position: fixed; left: 0; top: 0; transition: width 0.3s; overflow: hidden; z-index: 1000; display: flex; flex-direction: column; }
        .sidebar:hover { width: 260px; }
        .sidebar-header { padding: 24px 16px 20px; border-bottom: 1px solid #eaedf2; }
        .logo { display: flex; align-items: center; gap: 14px; text-decoration: none; }
        .logo-icon { font-size: 32px; }
        .sidebar-nav { flex: 1; padding: 20px 12px; display: flex; flex-direction: column; gap: 2px; }
        .nav-item { display: flex; align-items: center; gap: 18px; padding: 12px 16px; border-radius: 10px; color: #5a5e6a; text-decoration: none; transition: all 0.2s; white-space: nowrap; font-size: 14px; font-weight: 500; }
        .nav-item i { font-size: 20px; width: 24px; text-align: center; flex-shrink: 0; color: #8a8f99; }
        .nav-item span { opacity: 0; transition: opacity 0.3s; }
        .sidebar:hover .nav-item span { opacity: 1; }
        .nav-item:hover { background: #f0f5ff; color: #0066ff; }
        .nav-item.active { background: #e6f0ff; color: #0044cc; }
        .sidebar-footer { padding: 16px 12px 24px; border-top: 1px solid #eaedf2; }
        .nav-item.logout { color: #FF6161; cursor: pointer; }
        .main-content { margin-left: 80px; flex: 1; }
        .top-bar { background: #fff; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #eaedf2; position: sticky; top: 0; z-index: 100; }
        .top-bar h1 { font-size: 22px; font-weight: 900; }
        .content { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .stat-card { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; padding: 16px 20px; display: flex; align-items: center; gap: 12px; }
        .stat-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .stat-icon.blue { background: #e6f0ff; color: #0066ff; }
        .stat-icon.green { background: #d1fae5; color: #065f46; }
        .stat-icon.orange { background: #fff3e0; color: #e65100; }
        .stat-icon.purple { background: #f0e6ff; color: #7B3FAF; }
        .stat-info .number { font-size: 22px; font-weight: 900; line-height: 1; }
        .stat-info .label { font-size: 11px; color: #8a8f99; margin-top: 2px; }

        .tabs-bar { display: flex; gap: 4px; background: #fff; border-radius: 12px; border: 1px solid #eaedf2; padding: 4px; margin-bottom: 16px; }
        .tab-btn { padding: 10px 24px; border-radius: 8px; border: none; background: transparent; font-family: 'Roboto', sans-serif; font-size: 14px; font-weight: 500; color: #5a5e6a; cursor: pointer; transition: all 0.2s; }
        .tab-btn:hover { background: #f0f2f5; }
        .tab-btn.active { background: #e6f0ff; color: #0044cc; }
        .tab-btn i { margin-right: 8px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .search-box { display: flex; align-items: center; background: #fff; border: 1px solid #eaedf2; border-radius: 8px; padding: 0 14px; height: 40px; margin-bottom: 12px; }
        .search-box i { color: #8a8f99; font-size: 14px; }
        .search-box input { border: none; background: transparent; padding: 0 10px; font-size: 13px; outline: none; width: 100%; font-family: 'Roboto', sans-serif; }

        .list-container { background: #fff; border-radius: 16px; border: 1px solid #eaedf2; padding: 16px; }
        .list-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 8px; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid #f0f2f5; }
        .list-item:hover { background: #f0f5ff; }
        .list-item:last-child { border-bottom: none; }
        .li-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .li-info { flex: 1; }
        .li-title { font-size: 13px; font-weight: 600; }
        .li-sub { font-size: 11px; color: #8a8f99; }
        .li-badge { font-size: 10px; padding: 3px 10px; border-radius: 10px; font-weight: 600; }
        .badge-green { background: #d1fae5; color: #065f46; }
        .badge-blue { background: #e6f0ff; color: #0044cc; }
        .badge-orange { background: #fef3c7; color: #92400e; }

        .empty-state { text-align: center; padding: 24px; color: #8a8f99; }
        .empty-state i { font-size: 32px; display: block; margin-bottom: 8px; color: #d0d5dd; }
    </style>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header"><a href="/pages/admin" class="logo"><span class="logo-icon"><span style="font-size:32px;line-height:1;">🎓</span></span></a></div>
        <nav class="sidebar-nav">
            <a href="/pages/admin" class="nav-item"><i class="fas fa-home"></i><span>Главная</span></a>
            <a href="/pages/admin/stats" class="nav-item active"><i class="fas fa-chart-bar"></i><span>Дашборд</span></a>
            <a href="/pages/admin/employees" class="nav-item"><i class="fas fa-users"></i><span>Сотрудники</span></a>
            <a href="/pages/admin/courses" class="nav-item"><i class="fas fa-plus-circle"></i><span>Курсы</span></a>
            <a href="/pages/admin/access" class="nav-item"><i class="fas fa-lock"></i><span>Доступы</span></a>
            <a href="/pages/admin/roles" class="nav-item"><i class="fas fa-tags"></i><span>Роли</span></a>
            <a href="/pages/admin/calendar" class="nav-item"><i class="fas fa-calendar-alt"></i><span>Календарь</span></a>
            <a href="/pages/admin/profile" class="nav-item"><i class="fas fa-user-cog"></i><span>Профиль</span></a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item logout" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i><span>Выйти</span></a>
        </div>
    </aside>

    <div class="main-content">
        <header class="top-bar">
            <h1><i class="fas fa-chart-bar"></i> Дашборд</h1>
        </header>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon blue"><i class="fas fa-users"></i></div>
                    <div class="stat-info"><div class="number" id="statUsers">0</div><div class="label">Сотрудников</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fas fa-book-open"></i></div>
                    <div class="stat-info"><div class="number" id="statCourses">0</div><div class="label">Курсов</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon orange"><i class="fas fa-user-tie"></i><i class="fas fa-plus-circle"></i></div>
                    <div class="stat-info"><div class="number" id="statAssignments">0</div><div class="label">Назначений</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fas fa-check"></i></div>
                    <div class="stat-info"><div class="number" id="statCompleted">0</div><div class="label">Завершено</div></div>
                </div>
            </div>

            <div class="tabs-bar">
                <button class="tab-btn active" data-tab="courses-tab"><i class="fas fa-book"></i> Курсы</button>
                <button class="tab-btn" data-tab="users-tab"><i class="fas fa-users"></i> Сотрудники</button>
            </div>

            <div class="tab-content active" id="courses-tab">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск по названию курса..." id="courseSearch" oninput="filterCourses()">
                </div>
                <div class="list-container" id="coursesList">
                    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>
                </div>
            </div>

            <div class="tab-content" id="users-tab">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="Поиск по ФИО или email..." id="userSearch" oninput="filterUsers()">
                </div>
                <div class="list-container" id="usersList">
                    <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Загрузка...</p></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('access_token');
        var userData = JSON.parse(localStorage.getItem('user') || 'null');
        if (!token || !userData || userData.role !== 'admin') { window.location.href = '/pages/'; }
        function handleLogout() { localStorage.clear(); window.location.href = '/pages/login'; }

        var allUsers = [];
        var allCourses = [];
        var allAssignments = [];
        var allProgress = {};

        function apiGet(url) {
            return fetch(url, { headers: { 'Authorization': 'Bearer ' + token } })
                .then(function(r) { return r.ok ? r.json() : []; })
                .catch(function() { return []; });
        }

        document.querySelectorAll('.tab-btn').forEach(function(btn) {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
                this.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(function(c) { c.classList.remove('active'); });
                document.getElementById(this.dataset.tab).classList.add('active');
            });
        });

        function loadData() {
            Promise.all([
                apiGet('/api/v1/admin/users'),
                apiGet('/api/v1/admin/courses'),
                apiGet('/api/v1/admin/assignments')
            ]).then(function(data) {
                allUsers = data[0];
                allCourses = data[1];
                allAssignments = data[2];
                
                document.getElementById('statUsers').textContent = allUsers.filter(function(u){return u.role !== 'admin';}).length;
                document.getElementById('statCourses').textContent = allCourses.length;
                document.getElementById('statAssignments').textContent = allAssignments.length;
                document.getElementById('statCompleted').textContent = allAssignments.filter(function(a){return a.status === 'completed';}).length;
                
                renderCourses();
                renderUsers();
            });
        }

        function renderCourses(filter) {
            var container = document.getElementById('coursesList');
            var courses = allCourses;
            if (filter) {
                courses = courses.filter(function(c) { return c.title.toLowerCase().includes(filter); });
            }
            if (!courses.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-book"></i><p>Нет курсов</p></div>';
                return;
            }
            container.innerHTML = courses.map(function(c) {
                var assigned = allAssignments.filter(function(a){return a.course_id === c.id;});
                var completed = assigned.filter(function(a){return a.status === 'completed';});
                var percent = assigned.length > 0 ? Math.round((completed.length / assigned.length) * 100) : 0;
                return '<div class="list-item" onclick="window.location.href=\'/pages/admin/course-detail/' + c.id + '\'">' +
                    '<div class="li-icon" style="background:#e6f0ff;color:#0066ff;"><span style="font-size:32px;line-height:1;">🎓</span></div>' +
                    '<div class="li-info"><div class="li-title">' + c.title + '</div>' +
                    '<div class="li-sub">' + assigned.length + ' назначено</div></div>' +
                    '<span class="li-badge ' + (percent === 100 ? 'badge-green' : 'badge-blue') + '">' + percent + '%</span>' +
                    '</div>';
            }).join('');
        }

        function renderUsers(filter) {
            var container = document.getElementById('usersList');
            var users = allUsers.filter(function(u){return u.role !== 'admin';});
            if (filter) {
                users = users.filter(function(u) { 
                    return (u.full_name || '').toLowerCase().includes(filter) || (u.email || '').toLowerCase().includes(filter);
                });
            }
            if (!users.length) {
                container.innerHTML = '<div class="empty-state"><i class="fas fa-users"></i><p>Нет сотрудников</p></div>';
                return;
            }
            var colors = ['#0066ff','#4CAF50','#e67e22','#7B3FAF','#c62828','#0d47a1'];
            container.innerHTML = users.map(function(u, i) {
                var initials = (u.full_name || u.username).split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);
                var userAssignments = allAssignments.filter(function(a){return a.user_id === u.id;});
                var completed = userAssignments.filter(function(a){return a.status === 'completed';}).length;
                var badge = userAssignments.length === 0 ? '<span class="li-badge badge-orange">Нет курсов</span>' : '<span class="li-badge ' + (completed === userAssignments.length ? 'badge-green' : 'badge-blue') + '">' + completed + '/' + userAssignments.length + '</span>';
                return '<div class="list-item" onclick="window.location.href=\'/pages/admin/user-detail/' + u.id + '\'">' +
                    '<div class="li-icon" style="background:' + (colors[i % colors.length]) + '15;color:' + colors[i % colors.length] + ';">' + initials + '</div>' +
                    '<div class="li-info"><div class="li-title">' + (u.full_name || u.username) + '</div>' +
                    '<div class="li-sub">' + u.email + '</div></div>' +
                    badge +
                    '</div>';
            }).join('');
        }

        function filterCourses() {
            var q = document.getElementById('courseSearch').value.toLowerCase();
            renderCourses(q);
        }

        function filterUsers() {
            var q = document.getElementById('userSearch').value.toLowerCase();
            renderUsers(q);
        }

        function showCourseDetails(courseId) {
            var course = allCourses.find(function(c){return c.id === courseId;});
            var assigned = allAssignments.filter(function(a){return a.course_id === courseId;});
            var container = document.getElementById('coursesList');
            
            var html = '<div style="padding:8px;cursor:pointer;" onclick="renderCourses()"><i class="fas fa-arrow-left"></i> Назад</div>';
            html += '<div style="padding:8px;"><strong>' + course.title + '</strong></div>';
            
            if (!assigned.length) {
                html += '<div class="empty-state"><i class="fas fa-users"></i><p>Никому не назначен</p></div>';
            } else {
                assigned.forEach(function(a) {
                    var user = allUsers.find(function(u){return u.id === a.user_id;});
                    if (!user) return;
                    var statusBadge = a.status === 'completed' ? '<span class="li-badge badge-green">Завершён</span>' : '<span class="li-badge badge-orange">В процессе</span>';
                    html += '<div class="list-item">' +
                        '<div class="li-info"><div class="li-title">' + (user.full_name || user.username) + '</div>' +
                        '<div class="li-sub">' + user.email + '</div></div>' +
                        statusBadge +
                        '</div>';
                });
                html += '<div style="padding:8px;"><button class="btn btn-primary btn-sm" onclick="exportCourse(' + courseId + ')"><i class="fas fa-inbox"></i> Экспорт</button></div>';
            }
            container.innerHTML = html;
        }

        function showUserDetails(userId) {
            var user = allUsers.find(function(u){return u.id === userId;});
            var assigned = allAssignments.filter(function(a){return a.user_id === userId;});
            var container = document.getElementById('usersList');
            
            var html = '<div style="padding:8px;cursor:pointer;" onclick="renderUsers()"><i class="fas fa-arrow-left"></i> Назад</div>';
            html += '<div style="padding:8px;"><strong>' + (user.full_name || user.username) + '</strong><div style="font-size:11px;color:#8a8f99;">' + user.email + '</div></div>';
            
            if (!assigned.length) {
                html += '<div class="empty-state"><i class="fas fa-book"></i><p>Нет назначенных курсов</p></div>';
            } else {
                assigned.forEach(function(a) {
                    var course = allCourses.find(function(c){return c.id === a.course_id;});
                    if (!course) return;
                    var statusBadge = a.status === 'completed' ? '<span class="li-badge badge-green">Завершён</span>' : '<span class="li-badge badge-orange">В процессе</span>';
                    html += '<div class="list-item">' +
                        '<div class="li-info"><div class="li-title">' + course.title + '</div></div>' +
                        statusBadge +
                        '</div>';
                });
                html += '<div style="padding:8px;"><button class="btn btn-primary btn-sm" onclick="exportUser(' + userId + ')"><i class="fas fa-inbox"></i> Экспорт</button></div>';
            }
            container.innerHTML = html;
        }

        function exportCourse(courseId) {
            var course = allCourses.find(function(c){return c.id === courseId;});
            var html = '<table><tr><th>Сотрудник</th><th>Email</th><th>Статус</th></tr>';
            allAssignments.filter(function(a){return a.course_id === courseId;}).forEach(function(a) {
                var user = allUsers.find(function(u){return u.id === a.user_id;});
                if (!user) return;
                html += '<tr><td>' + (user.full_name || user.username) + '</td><td>' + user.email + '</td><td>' + (a.status === 'completed' ? 'Завершён' : 'В процессе') + '</td></tr>';
            });
            html += '</table>';
            downloadExcel(html, 'course_' + courseId);
        }

        function exportUser(userId) {
            var user = allUsers.find(function(u){return u.id === userId;});
            var html = '<table><tr><th>Курс</th><th>Статус</th></tr>';
            allAssignments.filter(function(a){return a.user_id === userId;}).forEach(function(a) {
                var course = allCourses.find(function(c){return c.id === a.course_id;});
                if (!course) return;
                html += '<tr><td>' + course.title + '</td><td>' + (a.status === 'completed' ? 'Завершён' : 'В процессе') + '</td></tr>';
            });
            html += '</table>';
            downloadExcel(html, 'employee_' + userId);
        }

        function downloadExcel(html, filename) {
            var blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename + '.xls';
            a.click();
            URL.revokeObjectURL(url);
        }

        loadData();
    </script>
</body>
</html>
