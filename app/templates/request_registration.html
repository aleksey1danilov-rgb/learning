<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | LearnHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f4f6fa 0%, #e9efff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .register-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .register-card .logo .logo-icon {
            font-size: 48px;
        }
        .register-card h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b0c10;
            text-align: center;
            margin-bottom: 8px;
        }
        .register-card .subtitle {
            text-align: center;
            color: #5a5e6e;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .register-card .form-group {
            margin-bottom: 16px;
        }
        .register-card .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0b0c10;
            margin-bottom: 4px;
        }
        .register-card .form-group input,
        .register-card .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #eef0f4;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            background: #fafbfc;
        }
        .register-card .form-group input:focus,
        .register-card .form-group textarea:focus {
            outline: none;
            border-color: #0066ff;
            background: #ffffff;
        }
        .register-card .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            background: #0066ff;
            color: #fff;
        }
        .btn:hover {
            background: #0052cc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,102,255,0.35);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .message.error {
            display: block;
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #f8bbd0;
        }
        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #5a5e6e;
        }
        .login-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .register-card { padding: 24px 20px; }
        }
    </style>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
</head>
<body>
    <div class="register-card">
        <div class="logo">
            <span class="logo-icon"><span style="font-size:32px;line-height:1;">🎓</span></span>
        </div>
        <h1>Подать заявку</h1>
        <p class="subtitle">Заполните форму для подачи заявки на регистрацию</p>

        <form id="registrationForm">
            <div class="form-group">
                <label>Полное имя *</label>
                <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="description" placeholder="Расскажите о себе и цели использования платформы"></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">Отправить заявку</button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Уже есть аккаунт? <a href="/pages/login">Войти</a>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const description = document.getElementById('description').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            
            if (!fullName || !email) {
                showMessage('Заполните все обязательные поля', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            try {
                const response = await fetch('/api/v1/registration/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: fullName, email, description })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('<i class="fas fa-check"></i> ' + data.message, 'success');
                    document.getElementById('registrationForm').reset();
                } else {
                    showMessage('❌ ' + (data.detail || 'Ошибка отправки заявки'), 'error');
                }
            } catch (error) {
                showMessage('❌ Ошибка соединения с сервером', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить заявку';
            }
        });
        
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
