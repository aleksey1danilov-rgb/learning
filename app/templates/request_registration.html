<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | LearnHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f4f6fa 0%, #e9efff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .register-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .register-card .logo {
            text-align: center;
            margin-bottom: 24px;
        }
        .register-card .logo .logo-icon {
            font-size: 48px;
        }
        .register-card h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0b0c10;
            text-align: center;
            margin-bottom: 8px;
        }
        .register-card .subtitle {
            text-align: center;
            color: #5a5e6e;
            font-size: 14px;
            margin-bottom: 28px;
        }
        .register-card .form-group {
            margin-bottom: 16px;
        }
        .register-card .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #0b0c10;
            margin-bottom: 4px;
        }
        .register-card .form-group input,
        .register-card .form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #eef0f4;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.2s;
            background: #fafbfc;
        }
        .register-card .form-group input:focus,
        .register-card .form-group textarea:focus {
            outline: none;
            border-color: #0066ff;
            background: #ffffff;
        }
        .register-card .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            background: #0066ff;
            color: #fff;
        }
        .btn:hover {
            background: #0052cc;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0,102,255,0.35);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .message.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }
        .message.error {
            display: block;
            background: #fce4ec;
            color: #c62828;
            border: 1px solid #f8bbd0;
        }
        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: #5a5e6e;
        }
        .login-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .register-card { padding: 24px 20px; }
        }
    
        body.dark {
            background: #0d0d1a;
            color: #ffffff;
        }
        body.dark .sidebar,
        body.dark .top-bar,
        body.dark .content > *,
        body.dark .table-container,
        body.dark .stat-card,
        body.dark .section-card,
        body.dark .course-card,
        body.dark .dash-card,
        body.dark .list-container,
        body.dark .search-box,
        body.dark .modal-box,
        body.dark .course-header,
        body.dark .modules-section,
        body.dark .user-header,
        body.dark .courses-section,
        body.dark .achievements-section,
        body.dark .profile-header,
        body.dark .stat-mini,
        body.dark .course-item,
        body.dark .week-grid-wrap,
        body.dark .mini-cal,
        body.dark .cal-top,
        body.dark .nav-buttons {
            background: #1a1a2e !important;
            border-color: #2d2d44 !important;
            color: #ffffff !important;
        }
        body.dark .nav-item {
            color: rgba(255,255,255,0.6) !important;
        }
        body.dark .nav-item:hover {
            background: rgba(255,255,255,0.06) !important;
            color: #fff !important;
        }
        body.dark .nav-item.active {
            background: rgba(108,62,184,0.2) !important;
            color: #9B6FE8 !important;
        }
        body.dark .stat-number,
        body.dark h1,
        body.dark h2,
        body.dark h3,
        body.dark .course-title,
        body.dark .li-title,
        body.dark .item-title,
        body.dark .cr-title {
            color: #ffffff !important;
        }
        body.dark .stat-label,
        body.dark .li-sub,
        body.dark .item-sub,
        body.dark .cr-meta,
        body.dark .desc,
        body.dark .email,
        body.dark .progress,
        body.dark .empty-state {
            color: rgba(255,255,255,0.4) !important;
        }
        body.dark input,
        body.dark select,
        body.dark textarea {
            background: rgba(255,255,255,0.04) !important;
            border-color: rgba(255,255,255,0.08) !important;
            color: rgba(255,255,255,0.8) !important;
        }
        body.dark table th {
            background: rgba(255,255,255,0.03) !important;
            color: rgba(255,255,255,0.4) !important;
        }
        body.dark table td {
            border-color: rgba(255,255,255,0.05) !important;
            color: rgba(255,255,255,0.8) !important;
        }
        body.dark table tr:hover td {
            background: rgba(255,255,255,0.03) !important;
        }
        .theme-toggle {
            position: fixed;
            top: 14px;
            right: 80px;
            z-index: 9999;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid #eaedf2;
            background: #fff;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        body.dark .theme-toggle {
            background: #1a1a2e;
            border-color: #2d2d44;
        }

</style>
    <link rel="stylesheet" href="/static/css/font-awesome.min.css">
    <link rel="stylesheet" href="/static/css/fa-fonts.css">
</head>
<body>
    <div class="register-card">
        <div class="logo">
            <span class="logo-icon"><span style="font-size:32px;line-height:1;">🎓</span></span>
        </div>
        <h1>Подать заявку</h1>
        <p class="subtitle">Заполните форму для подачи заявки на регистрацию</p>

        <form id="registrationForm">
            <div class="form-group">
                <label>Полное имя *</label>
                <input type="text" id="fullName" placeholder="Иванов Иван Иванович" required>
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" id="email" placeholder="user@example.com" required>
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="description" placeholder="Расскажите о себе и цели использования платформы"></textarea>
            </div>
            <button type="submit" class="btn" id="submitBtn">Отправить заявку</button>
        </form>

        <div class="message" id="message"></div>

        <div class="login-link">
            Уже есть аккаунт? <a href="/pages/login">Войти</a>
        </div>
    </div>

    <script>
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const description = document.getElementById('description').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');
            
            if (!fullName || !email) {
                showMessage('Заполните все обязательные поля', 'error');
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Отправка...';
            
            try {
                const response = await fetch('/api/v1/registration/request', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ full_name: fullName, email, description })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Сохраняем email для страницы статуса
                    localStorage.setItem('request_email', email);
                    showMessage('<i class="fas fa-check"></i> ' + data.message, 'success');
                    // Перенаправляем на страницу статуса заявки
                    setTimeout(function() {
                        window.location.href = '/pages/request-status';
                    }, 1500);
                } else {
                    showMessage('❌ ' + (data.detail || 'Ошибка отправки заявки'), 'error');
                }
            } catch (error) {
                showMessage('❌ Ошибка соединения с сервером', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Отправить заявку';
            }
        });
        
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }
    
        // Тёмная тема
        var savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark');
        }
        function toggleTheme() {
            document.body.classList.toggle('dark');
            var isDark = document.body.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            var btn = document.getElementById('themeToggleBtn');
            if (btn) btn.textContent = isDark ? '☀️' : '🌙';
        }
        // Добавляем кнопку переключения
        document.addEventListener('DOMContentLoaded', function() {
            var btn = document.createElement('button');
            btn.className = 'theme-toggle';
            btn.id = 'themeToggleBtn';
            btn.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
            btn.onclick = toggleTheme;
            document.body.appendChild(btn);
        });

</script>
</body>
</html>
